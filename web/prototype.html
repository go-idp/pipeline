<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pipeline Web · 产品原型</title>
<style>
  :root{
    --bg:#FAFAFA; --panel:#FFFFFF; --border:#E4E4E7; --border-2:#F1F1F3;
    --text:#18181B; --text-2:#71717A; --text-3:#A1A1AA;
    --hover:#F4F4F5; --active:#EFEFF0;
    --blue:#3B82F6; --green:#16A34A; --red:#DC2626; --amber:#D97706;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Inter","SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{font-family:var(--sans);font-size:13.5px;line-height:1.55;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer}
  input,textarea,select{font-family:inherit;font-size:13px;color:var(--text)}
  ::selection{background:#E4E4E7}
  a{color:inherit;text-decoration:none}

  /* ---------- layout ---------- */
  .app{display:flex;min-height:100vh}
  .sidebar{position:fixed;inset:0 auto 0 0;width:232px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:20}
  .main{flex:1;margin-left:232px;display:flex;flex-direction:column;min-width:0}
  .content{flex:1;padding:24px 32px 64px;max-width:1240px;width:100%;margin:0 auto}

  /* ---------- sidebar ---------- */
  .sb-brand{display:flex;align-items:center;gap:10px;height:56px;padding:0 16px;border-bottom:1px solid var(--border-2)}
  .logo{width:24px;height:24px;border-radius:6px;background:#18181B;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
  .logo svg{width:12px;height:12px}
  .sb-brand .nm{font-size:14px;font-weight:600;letter-spacing:-.01em}
  .sb-brand .ver{margin-left:auto;font-size:11px;color:var(--text-3);border:1px solid var(--border);border-radius:4px;padding:1px 6px}
  .sb-nav{flex:1;overflow-y:auto;padding:10px 8px}
  .sb-sec{font-size:11px;font-weight:500;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;padding:12px 10px 6px}
  .nav-item{display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:6px;color:var(--text-2);font-weight:500;font-size:13.5px;cursor:pointer;user-select:none;position:relative}
  .nav-item:hover{background:var(--hover);color:var(--text)}
  .nav-item.active{background:var(--hover);color:var(--text)}
  .nav-item.active::before{content:"";position:absolute;left:-8px;top:7px;bottom:7px;width:2px;border-radius:2px;background:var(--text)}
  .nav-item svg{width:16px;height:16px;flex:none}
  .nav-item .cnt{margin-left:auto;font-size:11px;font-weight:600;color:var(--text-3);background:var(--border-2);border-radius:10px;padding:0 7px;min-width:18px;text-align:center}
  .sb-foot{border-top:1px solid var(--border-2);padding:12px}
  .srv-state{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:6px;font-size:12px;color:var(--text-2)}
  .srv-state:hover{background:var(--hover)}
  .dot{width:6px;height:6px;border-radius:50%;flex:none;background:var(--text-3)}
  .dot.green{background:var(--green)}
  .dot.blue{background:var(--blue);animation:pulse 1.6s ease-in-out infinite}
  .dot.red{background:var(--red)}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(59,130,246,.35)}50%{box-shadow:0 0 0 4px rgba(59,130,246,0)}}

  /* ---------- topbar ---------- */
  .topbar{height:56px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;padding:0 32px;background:var(--bg)}
  .tb-title{font-size:15px;font-weight:600;letter-spacing:-.01em}
  .tb-crumb{font-size:13px;color:var(--text-3)}
  .tb-crumb b{color:var(--text-2);font-weight:500}
  .tb-spacer{flex:1}
  .tb-search{position:relative;display:flex;align-items:center}
  .tb-search svg{position:absolute;left:9px;width:14px;height:14px;color:var(--text-3);pointer-events:none}
  .tb-search input{width:240px;height:32px;padding:0 30px 0 30px;border:1px solid var(--border);border-radius:6px;background:var(--panel);outline:none}
  .tb-search input:focus{border-color:var(--text)}
  .tb-search .hint{position:absolute;right:8px;font-size:11px;color:var(--text-3);border:1px solid var(--border);border-radius:4px;padding:0 5px;background:#fff;pointer-events:none}

  /* ---------- components ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:32px;padding:0 12px;border-radius:6px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:13px;font-weight:500;white-space:nowrap;transition:background .12s}
  .btn:hover{background:var(--hover)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn svg{width:14px;height:14px}
  .btn-primary{background:#18181B;border-color:#18181B;color:#fff}
  .btn-primary:hover{background:#27272A}
  .btn-danger{color:var(--red);border-color:var(--border)}
  .btn-danger:hover{background:#FEF2F2;border-color:#FECACA}
  .btn-icon{width:32px;padding:0}
  .btn-sm{height:26px;padding:0 9px;font-size:12px;border-radius:5px}
  .btn-sm svg{width:12px;height:12px}
  .kbd{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;font-size:11px;font-weight:500;color:var(--text-2);border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;background:#fff}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:8px}
  .card-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border-2);font-size:13.5px;font-weight:600}
  .card-h .sub{font-size:12px;font-weight:400;color:var(--text-3)}
  .card-b{padding:16px}
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:14px 16px}
  .stat .lb{font-size:12px;font-weight:500;color:var(--text-2)}
  .stat .vl{font-size:24px;font-weight:600;letter-spacing:-.02em;margin-top:4px;line-height:1.2}
  .stat .vl small{font-size:13px;font-weight:500;color:var(--text-3);margin-left:2px}
  .stat .sb{font-size:12px;color:var(--text-3);margin-top:2px}

  .tbl{width:100%;border-collapse:collapse}
  .tbl th{font-size:11.5px;font-weight:500;color:var(--text-3);text-align:left;padding:0 16px 8px;border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.04em;user-select:none}
  .tbl td{padding:0 16px;height:44px;border-bottom:1px solid var(--border-2);font-size:13.5px;vertical-align:middle}
  .tbl tbody tr{cursor:pointer}
  .tbl tbody tr:hover{background:#FCFCFD}
  .tbl .row-check{width:20px}
  .row-actions{display:flex;align-items:center;gap:4px;justify-content:flex-end}
  .tbl td.num,.tbl th.num{text-align:right}

  .badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--text-2)}
  .badge .dot{width:7px;height:7px}
  .pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:11px;background:#F4F4F5;font-size:12px;font-weight:500;color:var(--text-2)}
  .pill .dot{width:6px;height:6px}

  .seg{display:inline-flex;border:1px solid var(--border);border-radius:6px;background:#F4F4F5;padding:3px;gap:2px}
  .seg button{height:26px;padding:0 11px;border:0;border-radius:4px;background:transparent;font-size:12.5px;font-weight:500;color:var(--text-2)}
  .seg button:hover{color:var(--text)}
  .seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.06),0 0 0 1px var(--border)}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;font-weight:500;color:var(--text-2);margin-bottom:6px}
  .inp{width:100%;height:32px;padding:0 10px;border:1px solid var(--border);border-radius:6px;background:#fff;outline:none}
  .inp:focus{border-color:var(--text)}
  textarea.inp{height:auto;padding:10px;resize:vertical;font-family:var(--mono);font-size:12.5px;line-height:1.6}
  .empty{padding:56px 20px;text-align:center;color:var(--text-3)}
  .empty .ei{width:36px;height:36px;margin:0 auto 12px;border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--text-2)}
  .empty .ei svg{width:18px;height:18px}
  .empty .et{font-size:14px;font-weight:600;color:var(--text);margin-bottom:4px}
  .empty .es{font-size:13px;margin-bottom:14px}

  /* overview */
  .ov-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;margin-bottom:20px}
  .bars{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:8px}
  .bar-wrap{flex:1;display:flex;flex-direction:column;gap:6px;height:100%;justify-content:flex-end}
  .bar{display:flex;flex-direction:column;justify-content:flex-end;border-radius:3px;overflow:hidden;background:var(--border-2);flex:1;min-height:4px}
  .bar .ok{background:#D1D5DB}
  .bar .fail{background:var(--text)}
  .bar-wrap .dl{font-size:10.5px;color:var(--text-3);text-align:center;margin-top:6px}
  .dist-row{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:13px}
  .dist-row .dk{display:flex;align-items:center;gap:8px;width:110px;color:var(--text-2)}
  .dist-row .dk .dot{width:7px;height:7px}
  .dist-row .dv{font-weight:600;width:28px;text-align:right}
  .dist-bar{flex:1;height:6px;border-radius:3px;background:var(--border-2);overflow:hidden}
  .dist-bar i{display:block;height:100%;border-radius:3px}
  .mini-list .mi{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border-2);cursor:pointer}
  .mini-list .mi:last-child{border-bottom:0}
  .mini-list .mi:hover{background:#FCFCFD;margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:6px}
  .mini-list .mn{flex:1;min-width:0}
  .mini-list .mn .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mini-list .mn .s{font-size:12px;color:var(--text-3)}
  .mini-list .mt{font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums}

  /* timeline */
  .tl{display:flex;height:46px;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--border-2)}
  .tl-seg{display:flex;align-items:center;justify-content:center;gap:6px;font-size:11.5px;font-weight:600;color:#fff;cursor:pointer;border-right:1px solid rgba(255,255,255,.55);white-space:nowrap;overflow:hidden;transition:filter .1s}
  .tl-seg:last-child{border-right:0}
  .tl-seg:hover{filter:brightness(.92)}
  .tl-seg.s-pending{background:#E4E4E7;color:var(--text-3)}
  .tl-seg.s-ok{background:#D1D5DB}
  .tl-seg.s-running{background:var(--blue)}
  .tl-seg.s-fail{background:var(--red)}
  .tl-seg.s-cancel{background:#E4E4E7;color:var(--text-3)}
  .tl-cap{display:flex;gap:18px;margin-top:8px;padding:0 2px}
  .tl-cap div{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);min-width:0}
  .tl-cap .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
  .tl-cap .dm{color:var(--text-3);font-variant-numeric:tabular-nums}

  /* step tree */
  .tree{border:1px solid var(--border);border-radius:8px;background:var(--panel);overflow:hidden}
  .tree-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border-2);font-size:13px;font-weight:600}
  .tree-h .sub{margin-left:auto;font-size:12px;font-weight:400;color:var(--text-3)}
  .tree-b{padding:8px;max-height:520px;overflow-y:auto}
  .tr{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px;border-radius:6px;cursor:pointer;user-select:none}
  .tr:hover{background:var(--hover)}
  .tr.sel{background:var(--active)}
  .tr .chev{width:14px;height:14px;color:var(--text-3);flex:none;transition:transform .1s;display:flex;align-items:center;justify-content:center}
  .tr .chev svg{width:12px;height:12px}
  .tr.open>.chev{transform:rotate(90deg)}
  .tr .ic{width:16px;height:16px;color:var(--text-2);flex:none}
  .tr .ic svg{width:15px;height:15px}
  .tr .tname{flex:1;min-width:0;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tr.l1 .tname{font-weight:600}
  .tr.l2{color:var(--text-2)}
  .tr.l3{color:var(--text-2)}
  .tr .tdur{font-size:11.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
  .tr .dot{width:7px;height:7px}
  .kids{display:none}
  .kids.open{display:block}
  .indent-1{padding-left:20px}
  .indent-2{padding-left:40px}
  .indent-3{padding-left:60px}

  /* logs */
  .log{border:1px solid var(--border);border-radius:8px;background:var(--panel);overflow:hidden;display:flex;flex-direction:column}
  .log-h{display:flex;align-items:center;gap:10px;padding:0 14px;height:42px;border-bottom:1px solid var(--border-2)}
  .log-h .lt{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .log-h .lsub{font-size:11.5px;color:var(--text-3);font-family:var(--mono)}
  .log-h .sp{flex:1}
  .log-h .srch{position:relative}
  .log-h .srch input{width:150px;height:26px;padding:0 8px 0 26px;border:1px solid var(--border);border-radius:5px;font-size:12px;outline:none;background:#fff}
  .log-h .srch input:focus{border-color:var(--text)}
  .log-h .srch svg{position:absolute;left:7px;top:6px;width:12px;height:12px;color:var(--text-3)}
  .log-b{overflow:auto;padding:10px 0;font-family:var(--mono);font-size:12px;line-height:1.65}
  .ll{display:flex;padding:0 8px;white-space:pre;border-left:2px solid transparent}
  .ll:hover{background:#FAFAFA}
  .ll.hit{border-left-color:var(--text)}
  .ln{width:44px;text-align:right;padding-right:12px;color:#D4D4D8;flex:none;user-select:none}
  .ts{width:58px;padding-right:10px;color:#D4D4D8;flex:none;user-select:none}
  .txt{color:#27272A}
  .txt.err{color:#B91C1C}
  .txt.grn{color:#15803D}
  mark{background:#FEF08A;color:inherit;border-radius:2px;padding:0 1px}
  .log-foot{border-top:1px solid var(--border-2);padding:6px 14px;display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--text-3)}
  .switch{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;color:var(--text-2);user-select:none}
  .switch i{width:26px;height:15px;border-radius:8px;background:#D4D4D8;position:relative;transition:background .15s}
  .switch i::after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .switch.on i{background:var(--text)}
  .switch.on i::after{left:13px}

  /* meta panel */
  .kv{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--border-2);font-size:12.5px}
  .kv:last-child{border-bottom:0}
  .kv .k{width:92px;flex:none;color:var(--text-3)}
  .kv .v{flex:1;color:var(--text-2);word-break:break-all;font-family:var(--mono);font-size:12px}
  .kv .v.plain{font-family:var(--sans);font-size:12.5px}

  /* modal / drawer / menu / palette / toast */
  .overlay{position:fixed;inset:0;background:rgba(9,9,11,.38);z-index:50;display:flex;align-items:center;justify-content:center;animation:fade .12s}
  .modal{background:#fff;border-radius:10px;box-shadow:0 20px 50px rgba(0,0,0,.16);width:440px;max-width:calc(100vw - 40px);animation:pop .14s}
  .modal.m-lg{width:560px}
  .m-h{display:flex;align-items:center;gap:10px;padding:16px 20px 0}
  .m-h .mt{font-size:15px;font-weight:600;letter-spacing:-.01em}
  .m-b{padding:14px 20px 0;font-size:13.5px;color:var(--text-2)}
  .m-f{display:flex;justify-content:flex-end;gap:8px;padding:18px 20px 20px}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes pop{from{opacity:0;transform:scale(.97) translateY(4px)}to{opacity:1;transform:none}}

  .drawer{position:fixed;top:0;right:0;bottom:0;width:760px;max-width:100vw;background:#fff;border-left:1px solid var(--border);box-shadow:-20px 0 60px rgba(0,0,0,.08);z-index:60;display:flex;flex-direction:column;animation:slide .18s}
  @keyframes slide{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
  .d-h{display:flex;align-items:center;gap:12px;height:56px;padding:0 20px;border-bottom:1px solid var(--border-2);flex:none}
  .d-h .dt{font-size:15px;font-weight:600}
  .d-b{flex:1;overflow-y:auto;padding:20px}
  .d-f{display:flex;align-items:center;gap:8px;padding:14px 20px;border-top:1px solid var(--border-2);background:#fff;flex:none}
  .d-f .sp{flex:1}

  .menu{position:fixed;z-index:70;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 10px 34px rgba(0,0,0,.12);padding:5px;min-width:170px;animation:pop .1s}
  .menu .mi{display:flex;align-items:center;gap:9px;height:30px;padding:0 9px;border-radius:5px;font-size:13px;color:var(--text);cursor:pointer}
  .menu .mi:hover{background:var(--hover)}
  .menu .mi svg{width:14px;height:14px;color:var(--text-2)}
  .menu .mi.danger{color:var(--red)}
  .menu .mi.danger svg{color:var(--red)}
  .menu .sep{height:1px;background:var(--border-2);margin:5px 4px}

  .palette{position:fixed;top:14vh;left:50%;transform:translateX(-50%);width:580px;max-width:calc(100vw - 40px);background:#fff;border-radius:10px;box-shadow:0 24px 70px rgba(0,0,0,.2),0 0 0 1px var(--border);z-index:80;overflow:hidden;animation:pop .13s}
  .palette input{width:100%;height:46px;padding:0 16px;border:0;outline:none;font-size:14px;background:transparent}
  .palette .pl{max-height:330px;overflow-y:auto;padding:6px;border-top:1px solid var(--border-2)}
  .palette .pg{font-size:11px;font-weight:500;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;padding:8px 10px 4px}
  .palette .pi{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:6px;font-size:13.5px;cursor:pointer}
  .palette .pi svg{width:15px;height:15px;color:var(--text-2)}
  .palette .pi.sel{background:var(--hover)}
  .palette .pi .hk{margin-left:auto;font-size:11px;color:var(--text-3)}

  .toasts{position:fixed;right:20px;bottom:20px;z-index:90;display:flex;flex-direction:column;gap:8px}
  .toast{display:flex;align-items:center;gap:9px;background:#18181B;color:#fff;font-size:13px;padding:10px 14px;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:pop .15s}
  .toast svg{width:14px;height:14px;flex:none}
  .toast.ok svg{color:#4ADE80}
  .toast.err svg{color:#F87171}

  .tabs2{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}
  .tabs2 button{height:30px;padding:0 14px;border:0;background:#fff;font-size:12.5px;font-weight:500;color:var(--text-2)}
  .tabs2 button+.tabs2 button{border-left:1px solid var(--border)}
  .tabs2 button.on{background:var(--hover);color:var(--text)}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;color:var(--text-2);border:1px solid var(--border);border-radius:4px;padding:1px 6px}
  .env-tag{display:inline-flex;align-items:center;gap:6px;background:var(--hover);border-radius:5px;padding:3px 8px;font-family:var(--mono);font-size:11.5px;color:var(--text-2)}
  .codeblock{background:#FCFCFD;border:1px solid var(--border);border-radius:8px;padding:14px;font-family:var(--mono);font-size:12px;line-height:1.6;color:#27272A;overflow:auto;white-space:pre}
  .codeblock .cm{color:var(--text-3)}
  .codeblock .ky{color:#B45309}
  .codeblock .st{color:#15803D}
  .hint-line{font-size:12px;color:var(--text-3);display:flex;align-items:center;gap:6px}
  .prog{height:5px;border-radius:3px;background:var(--border-2);overflow:hidden;flex:1}
  .prog i{display:block;height:100%;background:var(--text);border-radius:3px;transition:width .4s}
  .vstage{border:1px solid var(--border);border-radius:8px;margin-bottom:12px;overflow:hidden}

  // 抖动：随机补 2-4 行
  const extra=['[pipeline] workdir: /tmp/go-idp/pipeline/'+run.id,'[pipeline] environment: PIPELINE_RUNNER=pipeline','$ echo "[$(date)] done"','[$(date)] done'];
  const n=2+Math.floor(rng()*3);
  for(let i=0;i<n;i++) push(rng()>0.85?'e':'o', extra[Math.floor(rng()*extra.length)]);
  return L;
}

/* ---------- run detail model ---------- */
function stagesModel(run){
  const plan=pipelines.find(p=>p.id===run.pipelineId) || pipelines[0];
  const rng=mulberry(seedOf(run.id));
  const stages=[];
  let idx=0, failPoint=-1;
  if(run.status==='failed'||run.status==='cancelled') failPoint = 1+Math.floor(rng()*(plan.stages.length-1));
  const totalSteps=plan.stages.reduce((n,s)=>n+s.jobs.reduce((m,j)=>m+j.steps.length,0),0);
  let step=0;
  plan.stages.forEach((s,si)=>{
    const jobs=[];
    let stageDur=0;
    s.jobs.forEach(j=>{
      const steps=j.steps.map(stepDef=>{
        const i=step++;
        let st;
        if(run.live) st='pending';
        else if(run.status==='pending') st='pending';
        else if(run.status==='succeeded') st='succeeded';
        else if(i<failPoint) st='succeeded';
        else if(i===failPoint) st=(run.status==='failed')?'failed':'cancelled';
        else st='pending';
        const dur=st==='succeeded'||st==='failed' ? 2+Math.floor(rng()*22) : (st==='cancelled'?Math.floor(rng()*8):0);
        stageDur+=dur;
        return {name:stepDef.name, cmd:stepDef.cmd, st, dur, lines: st==='pending'&&!run.live?[]:stepLogs(run,stepDef.name,st,rng)};
      });
      jobs.push({name:j.name, steps});
    });
    let sst;
    if(run.live) sst= si===0?'running':'pending';
    else if(run.status==='pending') sst='pending';
    else if(run.status==='succeeded') sst='succeeded';
    else if(si*1 < failPoint) sst='succeeded';
    else if(si===failPoint) sst=(run.status==='failed')?'failed':'cancelled';
    else sst='pending';
    stages.push({name:s.name, mode:s.mode, jobs, st:sst, dur: stageDur>0?stageDur:0});
  });
  return {plan, stages};
}

/* ---------- live run simulation ---------- */
const liveRun = runs.find(r=>r.live);
const liveModel = liveRun ? stagesModel(liveRun) : null;
let liveCursor = {si:0, ji:0, ki:0, li:0, stepStart:null, stepElapsed:0, opened:false};
function liveTotalSteps(m){ return m.plan.stages.reduce((n,s)=>n+s.jobs.reduce((x,j)=>x+j.steps.length,0),0); }
function liveFlat(m){ const f=[]; m.stages.forEach(s=>s.jobs.forEach(j=>j.steps.forEach(k=>f.push({s,j,k})))); return f; }
function liveTick(){
  if(!liveRun || liveRun.status!=='running') return;
  const flat=liveFlat(liveModel);
  const cur=liveCursor;
  const total=flat.length;
  if(cur.si>=total){ // finished
    liveRun.status='succeeded'; liveRun.dur=Math.round((Date.now()-liveRun.startedAt)/1000);
    liveModel.stages.forEach(s=>{ s.st='succeeded'; });
    toast('运行 '+shortId(liveRun.id)+' 完成','ok');
    if(A.detail===liveRun.id) renderRunDetail();
    else if(!hash()[0]) renderOverview();
    return;
  }
  const el=flat[cur.si];
  if(cur.li===0){ cur.stepStart=Date.now(); el.s.st=el.s.st==='running'?el.s.st:'running'; el.j.st='running'; el.k.st='running'; }
  const lines=el.k.lines;
  if(cur.li<lines.length){
    const n=1+Math.floor(Math.random()*1.6);
    for(let i=0;i<n&&cur.li<lines.length;i++,cur.li++){
      const l=lines[cur.li]; el.k.view=el.k.view||[]; el.k.view.push(l);
      A.liveLines++;
    }
  } else {
    el.k.st='succeeded'; el.j.st='succeeded';
    const stageEl=liveModel.stages.find(s=>s.jobs.includes(el.j));
    const done=stageEl.jobs.every(j=>j.steps.every(k=>k.st!=='running'&&k.st!=='pending'));
    if(done){ stageEl.st='succeeded'; stageEl.dur=Math.round((Date.now()-liveRun.startedAt)/1000); }
    cur.si++; cur.li=0;
    if(cur.si<total){ const nx=flat[cur.si]; nx.s.st='running'; }
    else { liveRun.status='succeeded'; liveRun.dur=Math.round((Date.now()-liveRun.startedAt)/1000); toast('运行 '+shortId(liveRun.id)+' 完成','ok'); }
  }
  if(A.detail===liveRun.id){ renderRunDetail(); }
  else if(!hash()[0]){ renderOverview(); }
  else if(hash()[0]==='runs'||hash()[0]==='queue'||hash()[0]==='pipelines'){ /* 静默更新 nav 计数 */ }
  renderSidebar();
}

/* ---------- runs ---------- */
function filterRuns(){
  let list=[...runs];
  if(A.runFilter!=='all') list=list.filter(r=>r.status===A.runFilter);
  const q=A.search.toLowerCase();
  if(q) list=list.filter(r=>r.id.toLowerCase().includes(q)||(pipelines.find(p=>p.id===r.pipelineId)||{}).name.toLowerCase().includes(q));
  return list;
}

function cancelRun(id){
  const r=runs.find(x=>x.id===id); if(!r) return;
  if(r.status==='running'||r.status==='pending'){ r.status='cancelled'; r.dur=r.dur||Math.round((Date.now()-r.startedAt)/1000); }
  toast('运行 #'+shortId(id)+' 已取消','ok');
  renderRuns(); renderSidebar();
}

/* ---------- run detail ---------- */
let selStepKey=null;
function renderRunDetail(id){
  A.detail=id;
  const r=runs.find(x=>x.id===id); if(!r){ content.innerHTML='<div class="empty">运行不存在</div>'; return; }
  const m=stagesModel(r);
  const pl=m.plan;
  const dur=r.dur||(r.status==='running'?Math.round((Date.now()-r.startedAt)/1000):0);
  const isLive=r.status==='running'||r.status==='pending';
  const err=r.error;

  // stage timeline
  const tlStages=m.stages;
  const totalDur=Math.max(1, tlStages.reduce((a,s)=>a+Math.max(1,s.dur),0));
  const tl=`
    <div class="tl">
      ${tlStages.map(s=>`
        <div class="tl-seg s-${s.st}" data-sel="${s.name}" style="flex:${Math.max(1,s.dur||1)}" title="${esc(s.name)} · ${s.st==='pending'?'等待中':s.st==='running'?'运行中':fmtDur(s.dur)}">
          ${s.st==='running'?'<span class="dot" style="background:#fff;width:5px;height:5px;animation:pulse 1.6s infinite"></span>':''}
          ${esc(s.name)}
        </div>`).join('')}
    </div>
    <div class="tl-cap">
      ${tlStages.map(s=>`<div><span class="dot ${s.st==='running'?'blue':s.st==='succeeded'?'green':s.st==='failed'?'red':''}"></span><span class="nm">${esc(s.name)}</span><span class="dm">${s.st==='pending'?'等待':fmtDur(s.dur)}</span></div>`).join('')}
    </div>`;

  // step tree
  let tree='';
  const selSt=selStepKey||`${tlStages[0]?.name}:0:0`;
  tlStages.forEach((s,si)=>{
    tree+=`
      <div class="tr l1 ${selSt.startsWith(s.name+':')?'open':''}" data-stage="${s.name}" style="margin-top:${si?'4px':''}">
        <span class="chev">${I.chev}</span><span class="dot ${s.st==='running'?'blue':s.st==='succeeded'?'green':s.st==='failed'?'red':''}"></span>
        <span class="tname">${esc(s.name)}</span>
        <span class="chip">${s.mode}</span>
        <span class="tdur">${s.st==='pending'?'等待':fmtDur(s.dur)}</span>
      </div>
      <div class="kids ${selSt.startsWith(s.name+':')?'open':''}">`;
    s.jobs.forEach((j,ji)=>{
      tree+=`<div class="tr l2 indent-1" data-stage="${s.name}" style="cursor:default"><span class="dot ${j.st==='running'?'blue':j.st==='succeeded'?'green':j.st==='failed'?'red':''}"></span><span class="tname">${esc(j.name)}</span><span class="tdur">${fmtDur(j.steps.reduce((a,k)=>a+k.dur,0))}</span></div>`;
      j.steps.forEach((k,ki)=>{
        const key=`${s.name}:${ji}:${ki}`;
        const active=key===selSt;
        tree+=`
          <div class="tr l3 indent-2 ${active?'sel':''}" data-step="${key}">
            <span class="dot ${k.st==='running'?'blue':k.st==='succeeded'?'green':k.st==='failed'?'red':''}"></span>
            <span class="ic">${I.term}</span>
            <span class="tname">${esc(k.name)}</span>
            <span class="tdur">${k.st==='pending'?'':fmtDur(k.dur)}</span>
          </div>`;
      });
    });
    tree+=`</div>`;
  });

  // selected step
  let curS=null,curJ=null,curK=null,keyParts=selSt.split(':');
  tlStages.forEach(s=>s.jobs.forEach(j=>j.steps.forEach(k=>{ const key=`${s.name}:${s.jobs.indexOf(j)}:${j.steps.indexOf(k)}`; if(key===selSt){curS=s;curJ=j;curK=k;} })));
  if(!curK){ curS=tlStages[0]; if(curS&&curS.jobs[0]){ curJ=curS.jobs[0]; curK=curJ.steps[0]; } }
  const viewLines=curK?(curK.view||curK.lines):[];
  const liveNow = isLive && curK && curK.st==='running';

  content.innerHTML=`
    <div style="display:flex;align-items:flex-start;gap:12px;margin-bottom:14px;flex-wrap:wrap">
      <div>
        <div style="display:flex;align-items:center;gap:10px">
          <span class="badge" style="font-size:14px;font-weight:600">${dotHtml(r.status)}${ST[r.status].label}</span>
          <h1 style="font-size:19px;font-weight:650;letter-spacing:-.01em">${esc(pl.name)} <span style="color:var(--text-3);font-weight:500;font-family:var(--mono);font-size:13px">#${shortId(r.id)}</span></h1>
        </div>
        <div style="display:flex;gap:14px;margin-top:6px;font-size:12px;color:var(--text-3)">
          <span>${r.trigger} 触发</span><span>${fmtClock(r.startedAt)}</span>
          ${r.dur?`<span>耗时 ${fmtDur(r.dur)}</span>`:''}
        </div>
        ${err?`<div style="display:flex;align-items:center;gap:8px;margin-top:8px;color:var(--red);font-size:12.5px;background:#FEF2F2;border:1px solid #FECACA;border-radius:6px;padding:6px 10px">${I.warn}<span style="font-family:var(--mono)">${esc(err)}</span></div>`:''}
      </div>
      <div style="flex:1"></div>
      ${isLive?`<button class="btn" data-cancel="${r.id}">${I.stop}取消</button>`:''}
      ${r.status==='succeeded'||r.status==='failed'||r.status==='cancelled'?`<button class="btn" data-rerun="${r.id}">${I.rr}重跑</button>`:''}
      <button class="btn" data-exp-log="${r.id}">${I.dl}导出日志</button>
      <button class="btn btn-icon" data-more="${r.id}">${I.more}</button>
    </div>

    <div style="margin-bottom:14px">${tl}</div>

    <div style="display:grid;grid-template-columns:320px 1fr;gap:14px;align-items:start">
      <div class="tree">
        <div class="tree-h">${I.layers} 执行结构 <span class="sub">stage / job / step</span></div>
        <div class="tree-b">${tree}</div>
      </div>
      <div class="log">
        <div class="log-h">
          <span class="lt">${esc(curK?curK.name:'')}</span>
          <span class="lsub">${curK?esc(curK.cmd):''}</span>
          <span class="sp"></span>
          <div class="srch">${I.search}<input placeholder="搜索日志" data-log-search></div>
          <button class="btn btn-icon btn-sm" data-copy-log>${I.copy}</button>
        </div>
        <div class="log-b" data-log-body>
          ${viewLines.map((l,i)=>`<div class="ll" data-i="${i}"><span class="ln">${i+1}</span><span class="ts">+${(i*0.4).toFixed(1)}s</span><span class="txt ${l.t==='e'?'err':''}">${esc(l.s)}</span></div>`).join('')}
          ${!viewLines.length&&curK?`<div class="ll"><span class="txt" style="color:var(--text-3)">${curK.st==='pending'?'（该步骤尚未开始，等待上游完成）':'（无日志输出）'}</span></div>`:''}
        </div>
        <div class="log-foot">
          <span>${viewLines.length} 行</span>
          ${liveNow?`<span style="display:flex;align-items:center;gap:6px"><span class="dot blue"></span>实时输出中</span>`:''}
          <span style="flex:1"></span>
          <span class="switch ${A.follow?'on':''}" data-follow><i></i>自动滚动</span>
        </div>
      </div>
    </div>

    <div class="card" style="margin-top:14px">
      <div class="card-h">元信息 <span class="sub">配置 / 环境 / 原始 YAML</span></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 30px;padding:12px 16px">
        <div class="kv"><div class="k">运行 ID</div><div class="v">${r.id}</div></div>
        <div class="kv"><div class="k">流水线</div><div class="v">${pl.name} (${pl.id})</div></div>
        <div class="kv"><div class="k">workdir</div><div class="v">/tmp/go-idp/pipeline/${r.id}</div></div>
        <div class="kv"><div class="k">timeout</div><div class="v">3600s</div></div>
        <div class="kv"><div class="k">image</div><div class="v">—</div></div>
        <div class="kv"><div class="k">触发</div><div class="v plain">${r.trigger}</div></div>
        <div class="kv" style="border-bottom:0"><div class="k">environment</div><div class="v">PIPELINE_RUNNER=pipeline · CI=true · ${pl.stages.length} stages</div></div>
        <div class="kv" style="border-bottom:0"><div class="k">YAML</div><div class="v plain"><span style="cursor:pointer;color:var(--text);text-decoration:underline" data-yaml="${r.id}">查看原始定义</span></div></div>
      </div>
    </div>`;

  // events
  content.querySelectorAll('.tr[data-stage]').forEach(el=>el.onclick=()=>{ el.classList.toggle('open'); const kids=el.nextElementSibling; if(kids&&kids.classList.contains('kids')) kids.classList.toggle('open'); });
  content.querySelectorAll('.tr[data-step]').forEach(el=>el.onclick=()=>{ selStepKey=el.dataset.step; renderRunDetail(id); });
  content.querySelectorAll('.tl-seg').forEach(el=>el.onclick=()=>{ const st=el.dataset.sel; const s=tlStages.find(x=>x.name===st); const sel=document.querySelector(`.tr[data-stage="${st}"]`); if(sel){sel.classList.add('open'); const kids=sel.nextElementSibling; if(kids) kids.classList.add('open');} selStepKey=st+':0:0'; renderRunDetail(id); });
  content.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>confirmModal('取消运行 #'+shortId(b.dataset.cancel),'运行将被终止，正在执行的步骤会立即停止。此操作不可撤销。',()=>{cancelRun(b.dataset.cancel); go('/runs');}));
  content.querySelectorAll('[data-rerun]').forEach(b=>b.onclick=()=>openRerunModal(b.dataset.rerun));
  content.querySelectorAll('[data-more]').forEach(b=>b.onclick=e=>{e.stopPropagation();openRowMenu(b,null,b.dataset.more);});
  content.querySelectorAll('[data-yaml]').forEach(el=>el.onclick=()=>openYamlModal(r.pipelineId));
  content.querySelectorAll('[data-exp-log]').forEach(b=>b.onclick=()=>exportRunLog(r,m));
  content.querySelectorAll('[data-copy-log]').forEach(b=>b.onclick=()=>{ const txt=viewLines.map(l=>l.s).join('\n'); copyText(txt); toast('日志已复制','ok'); });
  content.querySelectorAll('[data-follow]').forEach(el=>el.onclick=()=>{ A.follow=!A.follow; renderRunDetail(id); });
  const srch=content.querySelector('[data-log-search]');
  if(srch){
    srch.oninput=()=>{
      const q=srch.value.toLowerCase(); const body=content.querySelector('[data-log-body]');
      body.querySelectorAll('.ll').forEach(ll=>{ ll.classList.remove('hit'); const t=ll.querySelector('.txt'); const hit=q&&t.textContent.toLowerCase().includes(q); if(hit){ ll.classList.add('hit'); const old=t.innerHTML; t.innerHTML=old.replace(/<mark>|<\/mark>/g,''); t.innerHTML=t.innerHTML.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>'); } });
      const first=body.querySelector('.ll.hit'); if(first) first.scrollIntoView({block:'center'});
    };
  }
  if(A.follow&&liveNow){ const b=content.querySelector('[data-log-body]'); if(b) b.scrollTop=b.scrollHeight; }
}

function parseYamlLite(yaml){
  const out={stages:[],ranges:[]};
  const lines=yaml.split('\n');
  let curS=null,curJ=null,curK=null;
  const stageStarts=[];
  lines.forEach((raw,i)=>{
    const line=raw.replace(/\s+$/,'');
    const t=line.trim();
    if(!t||t.startsWith('#'))return;
    const indent=line.length-line.trimStart().length;
    let m;
    if((m=t.match(/^-\s*name:\s*(.*)$/))){
      const nm=m[1].replace(/^['"]|['"]$/g,'').trim();
      if(indent===2){ curS={name:nm,mode:'parallel',jobs:[]}; out.stages.push(curS); stageStarts.push(i); curJ=null;curK=null; }
      else if(indent===4&&curS){ curJ={name:nm,steps:[]}; curS.jobs.push(curJ); curK=null; }
      else if(indent===6&&curJ){ curK={name:nm,cmd:''}; curJ.steps.push(curK); }
    } else if((m=t.match(/^(name|run_mode|command|type|description):\s*(.*)$/))){
      const k=m[1],v=m[2].replace(/^['"]|['"]$/g,'').trim();
      if(k==='name'){ if(indent===0) out.name=v; else if(indent===2&&curS&&!curJ) curS.name=v; else if(indent===4&&curJ&&!curK) curJ.name=v; else if(indent===6&&curK) curK.name=v; }
      else if(k==='run_mode'&&indent===2&&curS) curS.mode=v;
      else if(k==='command'&&indent===6&&curK) curK.cmd=v;
    }
  });
  stageStarts.forEach((s,i)=>{ const e= i<stageStarts.length-1?stageStarts[i+1]-1:lines.length-1; out.ranges.push([s,e]); });
  return out;
}
function prettyYaml(y){ return y.split('\n').map(l=>l.replace(/\s+$/,'')).join('\n').replace(/\n{3,}/g,'\n\n'); }

function openPalette(q){
  closePalette();
  const pv=document.createElement('div'); pv.className='palette'; pv.dataset.pv='1';
  pv.innerHTML=`<input placeholder="输入命令或搜索…（↑↓ 选择，Enter 执行）"><div class="pl"></div>`;
  document.body.appendChild(pv);
  const input=pv.querySelector('input');
  let sel=0, items=[];
  function build(){
    const query=(input.value||'').toLowerCase();
    items=[];
    const groups=[];
    groups.push(['页面',[
      ['总览','overview','/overview',I.overview],
      ['流水线','pipelines','/pipelines',I.layers],
      ['运行','runs','/runs',I.runs],
      ['队列','queue','/queue',I.queue],
      ['设置','settings','/settings',I.settings],
    ]]);
    groups.push(['操作',[
      ['新建流水线','new',null,I.plus],
      ['运行流水线…','runpl',null,I.play],
      ['查看运行中的任务','running',null,I.clock],
    ]]);
    const flat=[];
    const pl=g=>g.filter(([t])=>!query||t.toLowerCase().includes(query)||(g[0]==='页面'&&('/'+g[0]).includes(query)));
    groups.forEach(g=>{ const f=pl([g[0],...g[1].filter(x=>!query||x[0].toLowerCase().includes(query)||x[1].includes(query))]); if(f.length>1) flat.push([g[0],f.slice(1)]); });
    items=flat.flatMap(g=>g[1].map(x=>[g[0],...x]));
    pv.querySelector('.pl').innerHTML=flat.map(g=>`<div class="pg">${g[0]}</div>`+g[1].map((x,i)=>{ const idx=items.findIndex(it=>it[2]===x[2]&&it[0]===x[0]); return `<div class="pi ${idx===sel?'sel':''}" data-idx="${idx}">${x[4]||I.spark}${x[0]}<span class="hk">${x[2]?'Go':'↵'}</span></div>`; }).join('')).join('');
    pv.querySelectorAll('.pi').forEach(el=>el.onclick=()=>{ const it=items[+el.dataset.idx]; run(it); });
  }
  function run(it){
    if(!it)return;
    if(it[2]==='/overview')go('/');
    else if(it[2]) go(it[2]);
    else if(it[1]==='new') openEditor(null);
    else if(it[1]==='runpl') openRunModal(null,[pipelines[0].id]);
    else if(it[1]==='running') go('/runs');
    closePalette();
  }
  input.addEventListener('input',()=>{sel=0;build();});
  input.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'){e.preventDefault();sel=Math.min(sel+1,items.length-1);build();}
    else if(e.key==='ArrowUp'){e.preventDefault();sel=Math.max(sel-1,0);build();}
    else if(e.key==='Enter'){e.preventDefault();run(items[sel]);}
    else if(e.key==='Escape'){closePalette();}
  });
  build();
  setTimeout(()=>input.focus(),30);
}

document.addEventListener('click',e=>{
  if(document.body.dataset.menu==='1' && !e.target.closest('.menu') && !e.target.closest('[data-more]')){
    document.querySelectorAll('.menu').forEach(el=>el.remove()); document.body.dataset.menu='';
  }
});
document.addEventListener('keydown',e=>{
  const inInput=e.target.matches('input,textarea');
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); openPalette(); return; }
  if(e.key==='Escape'){ closeOverlays(); return; }
  if(!inInput && e.key==='/' && !document.querySelector('[data-pv="1"]')){ const s=document.querySelector('#tb-search'); if(s){ e.preventDefault(); s.focus(); } }
});
window.addEventListener('hashchange',()=>{ render(); window.scrollTo(0,0); });

/* ---------- init ---------- */
render();
setTimeout(()=>{ toast('欢迎使用 Pipeline Web · 产品原型'); },400);
</script>
</body>
</html>
